<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Junior Astronaut Mission Trainer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <!-- 1. Title -->
    <section id="screen-title" class="screen">
      <h1 tabindex="-1">🚀 Junior Astronaut Mission Trainer</h1>
      <p class="lead">Run a base on the Moon or Mars for 10 days. Keep your crew safe and do real science!</p>
      <div id="sun-panel" class="card" aria-live="polite"></div>
      <button type="button" id="btn-play" class="big">Play</button>
    </section>

    <!-- 2. Choose your base -->
    <section id="screen-choose" class="screen" hidden>
      <h2 tabindex="-1">Choose your base</h2>
      <div id="base-cards" class="base-cards"></div>
      <button type="button" id="btn-choose-back">Back</button>
    </section>

    <!-- 3. Mission briefing -->
    <section id="screen-briefing" class="screen" hidden>
      <h2 tabindex="-1">Mission briefing</h2>
      <div class="card">
        <p class="speaker">👩🏾‍🚀 CAPCOM Kemi says:</p>
        <div id="briefing-lines"></div>
      </div>
      <form id="briefing-form">
        <label for="base-name">Name your base:</label>
        <input id="base-name" type="text" maxlength="20" autocomplete="off">
        <button type="submit" class="big">Start mission</button>
      </form>
    </section>

    <!-- 4. Daily base screen -->
    <section id="screen-base" class="screen" hidden>
      <h2 id="base-title" tabindex="-1"></h2>
      <div id="meters" class="meters"></div>
      <div id="news" class="card news" aria-live="polite"></div>
      <h3>Power plan</h3>
      <div id="power" class="card"></div>
      <div id="systems"></div>
      <p id="waste-warning" role="status"></p>
      <button type="button" id="btn-run" class="big">Run the day ▶</button>
    </section>

    <!-- 6. Mission results -->
    <section id="screen-results" class="screen" hidden>
      <h2 id="results-title" tabindex="-1"></h2>
      <div id="results-body"></div>
      <button type="button" id="btn-again" class="big">Play again</button>
      <button type="button" id="btn-other-base" class="big secondary">Try the other base</button>
      <button type="button" id="btn-title">Back to title</button>
    </section>
  </main>

  <!-- 5. Day report popup -->
  <dialog id="report" aria-labelledby="report-title">
    <div id="report-body"></div>
    <button type="button" id="report-next" class="big">Next</button>
  </dialog>

  <script type="module" src="js/main.js"></script>
</body>
</html>
